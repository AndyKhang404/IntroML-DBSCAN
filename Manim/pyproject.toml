[project]
name = "dbscan-manim"
version = "0.1.0"
description = "Manim visualization scenes for DBSCAN (KDD-96)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "manim>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scenes"]
